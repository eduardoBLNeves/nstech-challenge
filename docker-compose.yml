services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "18482:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=orders;Username=orders;Password=orders
      Jwt__Issuer: nstech-order-service
      Jwt__Audience: nstech-order-service
      Jwt__Key: docker-dev-key-change-me-32bytes-min
      Jwt__ExpiresMinutes: "60"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
